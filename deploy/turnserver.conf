# /etc/turnserver.conf: the STUN and TURN server of the calls, on the same machine as the app (package "coturn").
# STUN tells each browser its public address; TURN relays the media when two networks cannot talk directly.
# What it relays is already encrypted end to end by the app: the relay only sees encrypted frames.
listening-port=3478
fingerprint
use-auth-secret
# The same value as TURN_SECRET of the backend (a long random text: openssl rand -hex 32).
static-auth-secret=CHANGE_ME
# Your domain.
realm=chatterly.example.com
# The public IP of the machine, and its private one (Oracle machines sit behind a NAT): external-ip=PUBLIC/PRIVATE
external-ip=PUBLIC_IP/PRIVATE_IP
# The range of ports used by the relays (open it, UDP, in the VCN and in iptables).
min-port=49152
max-port=49252
# Safety: nobody can use the relay to reach the machine itself or its network.
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
no-cli
no-tlsv1
no-tlsv1_1
