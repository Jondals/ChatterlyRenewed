# docker-compose.yml
# The app in one container (API and web app). HTTPS comes from a Caddy that is already running on the machine (it can
# serve other sites too): see deploy/Caddyfile.host. The app listens only on this machine: 3000 (API) and 3001 (web).
#   cp deploy/.env.docker.example .env   (write your domain and secrets)
#   docker compose up -d --build app
# Without a Caddy of your own, this file can run one too:  docker compose --profile caddy up -d --build
# Optional own TURN server for calls: docker compose --profile turn up -d
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      CORS_ORIGINS: https://${DOMAIN:-localhost}
      JWT_SECRET: ${JWT_SECRET:-}
      SERVER_SECRET: ${SERVER_SECRET:-}
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
    volumes:
      - chatterly-data:/data
    ports:
      - '127.0.0.1:3000:3000'
      - '127.0.0.1:3001:4200'
    expose:
      - '3000'
      - '4200'

  caddy:
    profiles: ['caddy']
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Relay of the calls when two networks cannot talk directly. It needs the host network (many UDP ports).
  turn:
    profiles: ['turn']
    image: coturn/coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./deploy/turnserver.conf:/etc/coturn/turnserver.conf:ro

volumes:
  chatterly-data:
  caddy-data:
  caddy-config:
