# docker-compose.yml
# The app in one container (API and web app). HTTPS comes from a Caddy that is already running on the machine (it can
# serve other sites too): see deploy/Caddyfile.host. The app listens only on this machine: 3000 (API) and 3001 (web).
#   cp deploy/.env.docker.example .env   (write your domain and secrets)
#   docker compose up -d --build app
# Without a Caddy of your own, this file can run one too:  docker compose --profile caddy up -d --build
# Own TURN relay for calls (recommended when people are on different networks): bash deploy/turn-setup.sh
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      CORS_ORIGINS: https://${DOMAIN:-localhost}
      JWT_SECRET: ${JWT_SECRET:-}
      SERVER_SECRET: ${SERVER_SECRET:-}
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
    volumes:
      - chatterly-data:/data
    # Hardening: the container only writes in its data volume and in memory, has no extra privileges and has no
    # capability of Linux (the app listens on ports above 1024 and needs none).
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 512
    ports:
      - '127.0.0.1:3000:3000'
      - '127.0.0.1:3001:4200'
    expose:
      - '3000'
      - '4200'

  caddy:
    profiles: ['caddy']
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  turn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --listening-ip=${TURN_PRIVATE_IP:-10.0.0.194}
      - --realm=${DOMAIN:-localhost}
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-}
      - --external-ip=${TURN_PUBLIC_IP:-51.170.53.50}/${TURN_PRIVATE_IP:-10.0.0.194}
      - --min-port=49152
      - --max-port=49252
      - --fingerprint
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      - --allowed-peer-ip=${TURN_PRIVATE_IP:-10.0.0.194}
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255

volumes:
  chatterly-data:
  caddy-data:
  caddy-config: